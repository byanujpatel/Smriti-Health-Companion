services:
  - type: web
    name: smriti
    runtime: docker
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: SMRITI_MEMORY_MODE
        value: cloud
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: SUPERMEMORY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
